name: Keep Supabase awake

# The free Supabase plan pauses a project after 7 days without requests. A
# paused project takes the admin panel down (the public site quietly falls back
# to its seeded content, so nobody notices). One cheap read twice a week keeps
# it awake: once a week would land right on the 7-day cutoff.
#
# Runs until KEEPALIVE_UNTIL, then switches itself off.

on:
  schedule:
    - cron: '17 6 * * 1,4'   # Mon + Thu, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  # re-enable itself (GitHub switches off schedules in a repo idle for 60
  # days) and disable itself once KEEPALIVE_UNTIL has passed
  actions: write

env:
  KEEPALIVE_UNTIL: '2027-01-06'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: assets/mo-config.js
          sparse-checkout-cone-mode: false

      - name: Stop after the end date
        id: expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(date -u +%F)" > "$KEEPALIVE_UNTIL" ]]; then
            echo "Past $KEEPALIVE_UNTIL: disabling this workflow."
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/supabase-keepalive.yml/disable"
            echo "expired=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping the database
        if: steps.expiry.outputs.expired != 'true'
        run: |
          url=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' assets/mo-config.js | head -1)
          key=$(grep -oE 'eyJ[A-Za-z0-9._-]+' assets/mo-config.js | head -1)
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
            "$url/rest/v1/showcase_items?select=id&limit=1" \
            -H "apikey: $key" -H "Authorization: Bearer $key")
          echo "HTTP $code"
          [ "$code" = 200 ]

      - name: Keep the schedule from being switched off
        if: steps.expiry.outputs.expired != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/supabase-keepalive.yml/enable"
